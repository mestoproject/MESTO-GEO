name: Build and publish MESTO GEO

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write

concurrency:
  group: mesto-geo-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate Python source
        run: python -m py_compile scripts/build_geo.py
      - name: Merge upstream GeoIP and GeoSite
        run: python scripts/build_geo.py --output dist
      - name: Check output sizes and manifest
        run: |
          test -s dist/geoip.dat
          test -s dist/geosite.dat
          python -m json.tool dist/manifest.json >/dev/null
          sha256sum dist/geoip.dat dist/geosite.dat > dist/SHA256SUMS
          ls -lh dist/
      - name: Validate categories with Xray-core
        run: |
          curl -fsSL --retry 3 https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip
          mkdir -p /tmp/mesto-xray
          unzip -q /tmp/xray.zip xray -d /tmp/mesto-xray
          chmod +x /tmp/mesto-xray/xray
          XRAY_LOCATION_ASSET="$PWD/dist" /tmp/mesto-xray/xray run -test -config ci/xray-validation.json
      - name: Protect against suspicious size regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/releases/tags/latest"
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "MESTO-GEO-CI"
          })
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print("First release; size regression check skipped")
                  raise SystemExit(0)
              raise
          assets = {a["name"]: a["size"] for a in release.get("assets", [])}
          for filename in ("geoip.dat", "geosite.dat"):
              previous = assets.get(filename)
              current = (pathlib.Path("dist") / filename).stat().st_size
              if previous and (current < previous * .65 or current > previous * 2):
                  raise SystemExit(f"Suspicious size regression: {filename}: previous={previous}, current={current}")
          PY
      - name: Include source notices
        run: |
          mkdir -p dist/licenses
          cp LICENSE dist/licenses/GPL-3.0.txt
          cp licenses/RU-DIRECT-MIT.txt dist/licenses/RU-DIRECT-MIT.txt
      - name: Publish stable rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "$GITHUB_SHA" --title "MESTO GEO (latest)" --notes "Automated GeoIP and GeoSite builds. Routing rules require client-side testing before rollout." --latest
          gh release upload latest dist/geoip.dat dist/geosite.dat dist/manifest.json dist/SHA256SUMS dist/licenses/GPL-3.0.txt dist/licenses/RU-DIRECT-MIT.txt --clobber
          gh release view latest --json assets --jq '.assets[] | [.name, .size] | @tsv'
